<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmos Interativo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      cursor: none;
    }
    canvas { display: block; }
    #cursor {
      position: fixed;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(0, 255, 255, 0.8);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1000;
      transition: transform 0.1s ease;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
    }
    #info {
      position: fixed;
      top: 20px;
      left: 20px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      z-index: 100;
      letter-spacing: 2px;
    }
    #info h1 {
      font-size: 18px;
      color: #0ff;
      text-shadow: 0 0 10px #0ff;
      margin-bottom: 8px;
    }
    #controls {
      position: fixed;
      bottom: 20px;
      left: 20px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 11px;
      z-index: 100;
      letter-spacing: 1px;
    }
    .key {
      display: inline-block;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 2px 6px;
      border-radius: 3px;
      margin-right: 4px;
    }
  </style>
</head>
<body>
  <div id="cursor"></div>
  <div id="info">
    <h1>⟨ COSMOS ⟩</h1>
    <div>partículas: <span id="count">0</span></div>
    <div>fps: <span id="fps">0</span></div>
    <div>modo: <span id="mode">NEBULOSA</span></div>
  </div>
  <div id="controls">
    <span class="key">SPACE</span> mudar modo &nbsp;
    <span class="key">C</span> limpar &nbsp;
    <span class="key">G</span> gravidade &nbsp;
    <span class="key">CLICK</span> explodir
  </div>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const cursor = document.getElementById('cursor');
    const countEl = document.getElementById('count');
    const fpsEl = document.getElementById('fps');
    const modeEl = document.getElementById('mode');

    let W = canvas.width = window.innerWidth;
    let H = canvas.height = window.innerHeight;
    window.addEventListener('resize', () => {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    });

    let mouse = { x: W / 2, y: H / 2 };
    let particles = [];
    let modes = ['NEBULOSA', 'GALÁXIA', 'BURACO NEGRO', 'SUPERNOVA'];
    let currentMode = 0;
    let gravity = true;
    let lastTime = performance.now();
    let frameCount = 0;
    let fps = 0;

    const palettes = [
      // NEBULOSA
      ['#ff006e', '#fb5607', '#ffbe0b', '#8338ec', '#3a86ff', '#06d6a0'],
      // GALÁXIA
      ['#00ffff', '#0080ff', '#7b2ff7', '#c471f5', '#f77fbe', '#ffffff'],
      // BURACO NEGRO
      ['#ff0000', '#ff4500', '#ff8c00', '#ffd700', '#ffffff', '#8b0000'],
      // SUPERNOVA
      ['#ffffff', '#fffacd', '#ffd700', '#ff6347', '#ff1493', '#00ced1'],
    ];

    class Particle {
      constructor(x, y, vx, vy) {
        this.x = x;
        this.y = y;
        this.vx = vx || (Math.random() - 0.5) * 4;
        this.vy = vy || (Math.random() - 0.5) * 4;
        this.life = 1.0;
        this.decay = Math.random() * 0.005 + 0.001;
        this.size = Math.random() * 3 + 1;
        const pal = palettes[currentMode];
        this.color = pal[Math.floor(Math.random() * pal.length)];
        this.trail = [];
        this.maxTrail = 12;
      }

      update() {
        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > this.maxTrail) this.trail.shift();

        if (gravity) {
          const dx = mouse.x - this.x;
          const dy = mouse.y - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy) + 1;
          const force = Math.min(50 / dist, 0.5);

          if (modes[currentMode] === 'BURACO NEGRO') {
            this.vx += (dx / dist) * force * 2;
            this.vy += (dy / dist) * force * 2;
            this.decay *= 0.999;
          } else if (modes[currentMode] === 'SUPERNOVA') {
            this.vx -= (dx / dist) * force * 0.8;
            this.vy -= (dy / dist) * force * 0.8;
          } else {
            this.vx += (dx / dist) * force * 0.3;
            this.vy += (dy / dist) * force * 0.3;
          }
        }

        if (modes[currentMode] === 'GALÁXIA') {
          const angle = Math.atan2(this.y - H/2, this.x - W/2);
          this.vx += Math.cos(angle + Math.PI/2) * 0.02;
          this.vy += Math.sin(angle + Math.PI/2) * 0.02;
        }

        this.vx *= 0.99;
        this.vy *= 0.99;
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;

        // Wrap around
        if (this.x < -50) this.x = W + 50;
        if (this.x > W + 50) this.x = -50;
        if (this.y < -50) this.y = H + 50;
        if (this.y > H + 50) this.y = -50;
      }

      draw() {
        // Trail
        for (let i = 0; i < this.trail.length; i++) {
          const t = this.trail[i];
          const alpha = (i / this.trail.length) * this.life * 0.3;
          const s = this.size * (i / this.trail.length);
          ctx.beginPath();
          ctx.arc(t.x, t.y, s, 0, Math.PI * 2);
          ctx.fillStyle = this.color + Math.floor(alpha * 255).toString(16).padStart(2, '0');
          ctx.fill();
        }

        // Main particle
        const alpha = this.life;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * 1.5, 0, Math.PI * 2);
        ctx.fillStyle = this.color + Math.floor(alpha * 255).toString(16).padStart(2, '0');
        ctx.fill();

        // Glow
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * 4, 0, Math.PI * 2);
        const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 4);
        gradient.addColorStop(0, this.color + Math.floor(alpha * 100).toString(16).padStart(2, '0'));
        gradient.addColorStop(1, this.color + '00');
        ctx.fillStyle = gradient;
        ctx.fill();
      }

      isDead() {
        return this.life <= 0;
      }
    }

    function spawnParticles(x, y, count, spread) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * spread;
        const vx = Math.cos(angle) * speed;
        const vy = Math.sin(angle) * speed;
        particles.push(new Particle(x, y, vx, vy));
      }
    }

    function explode(x, y) {
      spawnParticles(x, y, 80, 12);
      // Shockwave effect
      const ring = { x, y, radius: 0, maxRadius: 300, alpha: 1 };
      shockwaves.push(ring);
    }

    let shockwaves = [];

    function drawShockwaves() {
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const s = shockwaves[i];
        s.radius += 8;
        s.alpha -= 0.02;

        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.strokeStyle = palettes[currentMode][0] + Math.floor(s.alpha * 150).toString(16).padStart(2, '0');
        ctx.lineWidth = 2;
        ctx.stroke();

        if (s.alpha <= 0) shockwaves.splice(i, 1);
      }
    }

    // Spawn ambient particles
    function spawnAmbient() {
      if (particles.length < 500) {
        const x = Math.random() * W;
        const y = Math.random() * H;
        particles.push(new Particle(x, y));
      }
    }

    // Mouse tracking
    document.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      cursor.style.left = (e.clientX - 10) + 'px';
      cursor.style.top = (e.clientY - 10) + 'px';

      // Continuous spawn on move
      if (Math.random() > 0.5) {
        spawnParticles(e.clientX, e.clientY, 2, 2);
      }
    });

    document.addEventListener('click', (e) => {
      explode(e.clientX, e.clientY);
    });

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        currentMode = (currentMode + 1) % modes.length;
        modeEl.textContent = modes[currentMode];
      }
      if (e.code === 'KeyC') {
        particles = [];
      }
      if (e.code === 'KeyG') {
        gravity = !gravity;
      }
    });

    // Main loop
    function animate() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
      ctx.fillRect(0, 0, W, H);

      // Center glow for certain modes
      if (modes[currentMode] === 'GALÁXIA' || modes[currentMode] === 'BURACO NEGRO') {
        const cx = W / 2;
        const cy = H / 2;
        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 200);
        grad.addColorStop(0, palettes[currentMode][0] + '20');
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);
      }

      spawnAmbient();

      // Update & draw particles
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].isDead()) {
          particles.splice(i, 1);
        }
      }

      drawShockwaves();

      // Mouse glow
      const mg = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 100);
      mg.addColorStop(0, palettes[currentMode][0] + '30');
      mg.addColorStop(1, 'transparent');
      ctx.fillStyle = mg;
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, 100, 0, Math.PI * 2);
      ctx.fill();

      // FPS counter
      frameCount++;
      const now = performance.now();
      if (now - lastTime >= 1000) {
        fps = frameCount;
        frameCount = 0;
        lastTime = now;
        fpsEl.textContent = fps;
      }
      countEl.textContent = particles.length;

      requestAnimationFrame(animate);
    }

    // Initial burst
    spawnParticles(W / 2, H / 2, 150, 6);
    animate();
  </script>
</body>
</html>
